<style>
*{box-sizing:border-box;margin:0}
body{background:#f4efe6;color:#111;font:16px/1.4 "Helvetica Neue",Arial,sans-serif;padding:26px;display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:minmax(150px,auto);gap:14px}
.c{border-radius:22px;padding:22px;display:flex;flex-direction:column;justify-content:space-between}

.red{grid-column:span 2;background:#ef4b2f;color:#fff}
.blue{grid-column:span 2;background:#2447d6;color:#fff}
.ink{grid-column:span 3;background:#111;color:#f4efe6}
.pink{grid-column:span 3;background:#f6b6c8}
