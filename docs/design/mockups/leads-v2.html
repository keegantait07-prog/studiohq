<style>
:root{--bg:#09090c;--p1:#0f0f14;--p2:#14141a;--p3:#1a1a22;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);--tx:#ececf1;--dim:#8b8b98;--dim2:#5f5f6b;--acc:#c6ff4a;--acc-d:rgba(198,255,74,.12);--warn:#ffb454;--blue:#7aa7ff}
*{box-sizing:border-box;margin:0}
body{background:#050507;color:var(--tx);font:13px/1.45 'Inter Tight',system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;justify-content:center;padding:24px}
.app{width:1320px;height:820px;background:var(--bg);border:1px solid var(--line2);border-radius:14px;overflow:hidden;display:grid;grid-template-columns:64px 272px 1fr;box-shadow:0 40px 120px rgba(0,0,0,.6)}
.rail{background:var(--p1);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding:46px 0 14px}
.rail i{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--dim2);font-style:normal;font-size:15px}
.rail i.on{background:var(--acc-d);color:var(--acc)}
.side{background:var(--p1);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding-top:46px}
.side .s-top{padding:0 14px 12px}
.search{display:flex;align-items:center;gap:8px;background:var(--p2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;color:var(--dim)}
.scroll{overflow:auto;min-height:0;flex:1;padding:4px 8px 12px}
.scroll::-webkit-scrollbar{width:8px}.scroll::-webkit-scrollbar-thumb{background:#23232c;border-radius:8px}
.lbl{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim2);padding:14px 8px 6px;font-weight:600}
.item{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;cursor:pointer;color:#c9c9d3}
.item:hover{background:var(--p2)}.item.on{background:var(--p3);color:var(--tx);box-shadow:inset 2px 0 0 var(--acc)}
.item .n{margin-left:auto;font:500 11.5px 'JetBrains Mono',monospace;color:var(--dim)}
.item .ico{width:18px;text-align:center;color:var(--dim)}
.item.on .ico{color:var(--acc)}
.meter{width:34px;height:3px;border-radius:3px;background:#24242d;overflow:hidden}.meter b{display:block;height:100%;background:var(--acc)}
.s-foot{padding:12px 14px;border-top:1px solid var(--line);display:flex;gap:8px}
button{font:inherit;color:var(--tx);background:var(--p3);border:1px solid var(--line2);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{background:#20202a}
button.pri{background:var(--acc);color:#10140a;border-color:transparent;font-weight:600}
button.pri:hover{filter:brightness(1.06)}
.main{display:grid;grid-template-columns:1fr 330px;min-width:0;min-height:0}
.col{display:flex;flex-direction:column;min-width:0;min-height:0;padding-top:46px}
.head{padding:6px 28px 14px}
.crumb{color:var(--dim2);font-size:11.5px;letter-spacing:.04em}
.h1{font:400 40px/1.05 'Instrument Serif',serif;letter-spacing:-.01em;margin:4px 0 10px}
.stats{display:flex;gap:22px;color:var(--dim);align-items:center}
.stats b{color:var(--tx);font-weight:600;margin-right:4px}
.tip{margin-top:14px;background:linear-gradient(180deg,var(--p2),var(--p1));border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:#c4c4cf;display:flex;gap:12px;align-items:flex-start}
.tip em{font-style:normal;color:var(--acc);font-weight:600;white-space:nowrap}
.bar{display:flex;align-items:center;gap:10px;padding:10px 28px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--p1)}
.seg{display:flex;background:var(--p2);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg span{padding:4px 12px;border-radius:7px;color:var(--dim);cursor:pointer}.seg span.on{background:var(--p3);color:var(--tx)}
.chip{padding:3px 9px;border-radius:99px;border:1px solid var(--line2);color:#c9c9d3;font-size:12px;cursor:pointer}.chip.on{background:var(--acc-d);border-color:rgba(198,255,74,.35);color:var(--acc)}
.sp{flex:1}
.list{overflow:auto;min-height:0;flex:1;padding:0 20px 24px}
.sec{display:flex;align-items:baseline;gap:10px;padding:20px 8px 8px;position:sticky;top:0;background:var(--bg);z-index:2}
.sec h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx);font-weight:600}
.sec span{color:var(--dim2);font-size:12px}.sec .go{margin-left:auto;font-size:12px;color:var(--acc);cursor:pointer}
.row{display:grid;grid-template-columns:34px minmax(0,1.2fr) 84px 170px minmax(0,1.4fr) 84px;gap:12px;align-items:center;padding:8px;border-radius:10px;cursor:pointer}
.row:hover{background:var(--p1)}.row.on{background:var(--p2);box-shadow:inset 0 0 0 1px var(--line2)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:11px;color:#0d0d10}
.nm b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nm small{color:var(--dim2);font:400 11.5px 'JetBrains Mono',monospace}
.role{font-size:11.5px;color:var(--dim);display:flex;align-items:center;gap:6px}.role:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c,#555)}
.em{font:400 12px 'JetBrains Mono',monospace;color:#b9b9c6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.em i{font-style:normal;color:var(--dim2)}
.em.no{color:var(--dim2);font-family:'Inter Tight'}
.act{justify-self:end}.act button{padding:4px 10px;font-size:12px}
.drawer{border-left:1px solid var(--line);background:var(--p1);padding:60px 22px 20px;overflow:auto}
.drawer .av{width:52px;height:52px;font-size:17px}
.drawer h2{font:400 28px/1.1 'Instrument Serif',serif;margin:12px 0 2px}
.kv{display:grid;grid-template-columns:78px 1fr;gap:9px 10px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.kv dt{color:var(--dim2)}.kv dd{margin:0;word-break:break-all}
.note{margin-top:16px;background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:#c4c4cf}
.btns{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.tree{padding:10px 28px 30px;overflow:auto;flex:1}
.t-root{display:flex;justify-content:center}
.node{background:var(--p2);border:1px solid var(--line2);border-radius:10px;padding:7px 11px;display:flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}
.node.on{border-color:rgba(198,255,74,.5);background:var(--acc-d)}
.node.big{padding:12px 20px;font:400 24px 'Instrument Serif',serif;border-color:rgba(198,255,74,.4)}
.tier{margin-top:34px;position:relative}
.tier:before{content:"";position:absolute;left:50%;top:-34px;height:34px;border-left:1px dashed var(--line2)}
.tier h4{text-align:center;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2);margin-bottom:12px}
.tier .wrap{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.node .av{width:20px;height:20px;font-size:9px}.node .dot{width:6px;height:6px;border-radius:50%;background:var(--acc)}.node .dot.x{background:var(--dim2)}
.legend{display:flex;gap:16px;justify-content:center;margin-top:30px;color:var(--dim2);font-size:12px}
.banner{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:#16161c;border:1px solid var(--line2);border-radius:99px;padding:8px 16px;color:var(--dim);font-size:12px}
.sdot{width:8px;height:8px;border-radius:50%;display:inline-block}.gcs{display:flex;gap:5px;overflow:hidden}.gc{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--p3);border:1px solid var(--line);color:#c4c4cf;white-space:nowrap}.gbar{display:flex;gap:6px;align-items:center;padding:8px 28px;border-bottom:1px solid var(--line);flex-wrap:wrap}.gbar:empty{display:none}.gl{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim2);margin-right:4px}</style></head>

const SIZE_C={big:'#c6ff4a',small:'#7aa7ff',team:'#ff9ad5'};

let mode='list',V={t:'all'},sel=null,tab='all',gf=null;
const $=s=>document.querySelector(s);
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};

const cnt=f=>ALL.filter(f).length;
function base(){
  if(V.t==='size')return ALL.filter(c=>c.size===V.k);
  if(V.t==='genre')return ALL.filter(c=>c.genres.includes(V.k));
  if(V.t==='ladder')return ALL.filter(c=>c.lid===V.k);
  return ALL;
}
function cs(){let c=base();if(tab==='email')c=c.filter(x=>x.emails.length);if(tab==='dm')c=c.filter(x=>!x.emails.length);if(gf)c=c.filter(x=>x.genres.includes(gf));return c}
const title=()=>V.t==='size'?SIZE_N[V.k]:V.t==='genre'?V.k:V.t==='ladder'?DATA.find(l=>l.id===V.k).name:'All leads';
function side(){
  const it=(on,ic,t,n,att)=>`<div class="item ${on?'on':''}" ${att}><span class="ico">${ic}</span><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t}</span><span class="n">${n}</span></div>`;
  $('#side').innerHTML=`<div class="lbl">Browse</div>`
   +it(V.t==='all','&#9776;','All leads',ALL.length,'data-t="all"')
   +['big','small','team'].map(k=>it(V.t==='size'&&V.k===k,`<span class="sdot" style="background:${SIZE_C[k]}"></span>`,SIZE_N[k],cnt(c=>c.size===k),`data-t="size" data-k="${k}"`)).join('')

}
function head(){

  document.querySelectorAll('[data-g]').forEach(e=>e.onclick=()=>{gf=gf===e.dataset.g?null:e.dataset.g;render()});

const gch=c=>c.genres.slice(0,2).map(g=>`<span class="gc">${g}</span>`).join('');

function groups(C){
  if(V.t==='size'){const m={};C.forEach(c=>(m[c.genres[0]]=m[c.genres[0]]||[]).push(c));return GENRES.filter(g=>m[g]).map(g=>[g,'',m[g]])}

}

function tree(){

  document.querySelectorAll('.node[data-i]').forEach(e=>e.onclick=()=>{sel=C.find(c=>String(c.k)===e.dataset.i);render()});
}
function drawer(){
  const c=sel;if(!c){$('#drawer').innerHTML=`<div style="color:var(--dim);margin-top:30vh;text-align:center">Select a contact to see their genres, emails and who they connect to.</div>`;return}

  ${c.note?`<div class="note">${c.note}</div>`:''}
  <div class="btns">${c.emails.length?'<button class="pri">Pitch</button>':'<button class="pri">Find email</button>'}<button>Add to CRM</button><button>Skip</button></div>`;
}
function render(){side();head();mode==='list'?list():tree();drawer()}
