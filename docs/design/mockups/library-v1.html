<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Studio HQ - Beats screen options</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:13px/1.45 'Geist',system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:#050506;display:flex;flex-direction:column;align-items:center;padding:16px 16px 24px;gap:12px;color:#eceaf6}
.ctl{display:flex;gap:18px;align-items:center;color:#8a8a93;font-size:12px}
.ctl .grp{display:flex;background:#141418;border:1px solid #26262d;border-radius:99px;padding:3px}
.ctl button{font:inherit;color:#9a9aa5;background:none;border:0;border-radius:99px;padding:5px 14px;cursor:pointer}
.ctl button.on{background:#2a2a33;color:#fff}
.note{color:#8a8a93;font-size:12px;max-width:1100px;text-align:center}
.app{--bg:#0d0d12;--p1:#121219;--p2:#181821;--p3:#20202b;--line:rgba(255,255,255,.06);--line2:rgba(255,255,255,.11);--tx:#eceaf6;--dim:#8d8aa3;--dim2:#5d5b72;--ac:#8b7cff;--ac2:#b9aeff;--acink:#0e0a2a;--ok:#5fd6a4;--warn:#ffb86b;--hf:'Bricolage Grotesque',system-ui,sans-serif;
 width:1360px;height:830px;border-radius:16px;overflow:hidden;position:relative;display:grid;grid-template-columns:224px 1fr;border:1px solid var(--line2);background:var(--bg);color:var(--tx);box-shadow:0 40px 120px rgba(0,0,0,.55)}
/* shell (already approved, Direction A) */
.nav{background:var(--p1);border-right:1px solid var(--line);padding:46px 12px 14px;display:flex;flex-direction:column;gap:2px}
.brand{font:800 18px var(--hf);letter-spacing:-.02em;padding:0 10px 18px}.brand i{color:var(--ac);font-style:normal}
.sec{font-size:11px;color:var(--dim2);padding:16px 10px 6px;font-weight:500}
.item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;color:var(--dim)}
.item.on{color:var(--tx);background:var(--p3)}
.item .badge{margin-left:auto;font-size:11px;color:var(--ac2);background:rgba(139,124,255,.14);padding:0 7px;border-radius:99px}
.sub{padding:1px 10px 1px 36px;color:var(--dim2);font-size:12px}
.nav-foot{margin-top:auto;display:flex;gap:10px;align-items:center;padding:12px 10px;border-top:1px solid var(--line);color:var(--dim)}
.av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#8b7cff,#ff9ad5);flex:none}
.stage{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.top{display:flex;align-items:center;gap:12px;padding:44px 32px 0}
.cmd{display:flex;align-items:center;gap:10px;flex:0 1 420px;background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--dim)}
.cmd kbd{margin-left:auto;font:500 11px 'Geist';background:var(--p3);border:1px solid var(--line2);border-radius:5px;padding:0 6px;color:var(--dim)}
.btn{font:500 13px 'Geist';border:1px solid var(--line2);background:var(--p2);color:var(--tx);border-radius:9px;padding:6px 12px;cursor:default;white-space:nowrap}
.btn.pri{background:var(--ac);color:var(--acink);border-color:transparent;font-weight:600}
.btn.sm{padding:3px 10px;font-size:12px;border-radius:7px}
.sp{flex:1}
.screen{flex:1;min-height:0;display:flex;padding:20px 0 0 32px;gap:0}
.main{flex:1;min-width:0;display:flex;flex-direction:column;padding-right:32px}
h1{font:700 38px/1 var(--hf);letter-spacing:-.035em}
.lede{color:var(--dim);margin-top:8px;font-size:14px}
.dock{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;display:flex;align-items:center;gap:14px;background:rgba(24,24,33,.88);backdrop-filter:blur(18px);border:1px solid var(--line2);border-radius:99px;padding:8px 18px 8px 8px;width:560px;z-index:5}
.play{width:38px;height:38px;border-radius:50%;background:var(--ac);color:var(--acink);display:grid;place-items:center;flex:none;font-size:12px}
.dock .t{font-weight:500}.dock .s{color:var(--dim);font-size:12px}
.dock .wf{flex:1;height:24px}
/* shared beat bits */
.seg{display:flex;gap:2px;background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:3px;width:max-content}
.seg span{padding:4px 11px;border-radius:7px;color:var(--dim);white-space:nowrap}
.seg span b{font-weight:500;color:var(--dim2);margin-left:5px;font-variant-numeric:tabular-nums}
.seg span.on{background:var(--p3);color:var(--tx)}
.bar{display:flex;align-items:center;gap:12px;margin-top:18px}.bar>*{white-space:nowrap}
.mono{font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;font-variant-numeric:tabular-nums;color:var(--dim)}
.st{display:inline-flex;align-items:center;gap:6px;color:var(--dim)}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.st.fin{--c:var(--ok)}.st.wip{--c:var(--warn)}.st.idea{--c:#6c6a82}
.chip{font-size:11.5px;color:var(--dim);background:var(--p2);border:1px solid var(--line);border-radius:6px;padding:0 7px}
.chip.warn{color:var(--warn);background:rgba(255,184,107,.08);border-color:rgba(255,184,107,.2)}
.key{font:500 12px 'Geist Mono',monospace;padding:0 6px;border-radius:5px;background:var(--p3);color:var(--ac2)}
.pl{width:24px;height:24px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;color:var(--dim);font-size:8px;flex:none}
.pl.on{background:var(--ac);color:var(--acink);border-color:transparent}
.fl{font:500 10px 'Geist Mono',monospace;color:var(--dim2);border:1px dashed var(--line2);border-radius:5px;padding:1px 5px}
.name{font-weight:500}.sm2{color:var(--dim2);font-size:12px}
.ready{display:flex;gap:3px}.ready i{width:14px;height:4px;border-radius:2px;background:var(--p3)}.ready i.f{background:var(--ac)}
svg.w{display:block;width:100%;height:100%}
.hide{display:none!important}
/* D1 ledger */
.tbl{margin-top:14px;flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.th,.tr{display:grid;grid-template-columns:30px minmax(170px,1.3fr) minmax(110px,1fr) 44px 52px 44px 72px 84px;align-items:center;gap:10px;padding:0 10px}
.th{color:var(--dim2);font-size:11.5px;height:30px;border-bottom:1px solid var(--line)}
.tr{height:40px;border-bottom:1px solid var(--line);border-radius:0}
.tr.sel{background:var(--p2);border-radius:9px;border-color:transparent}
.tr .tg{display:flex;gap:5px;overflow:hidden}
.insp{width:300px;flex:none;border-left:1px solid var(--line);padding:4px 24px 0;margin-left:0;display:flex;flex-direction:column;gap:14px;background:linear-gradient(180deg,var(--p1),transparent 70%)}
.insp h3{font:700 22px/1.1 var(--hf);letter-spacing:-.02em}
.insp .wfbig{height:74px;background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.facts{display:grid;grid-template-columns:1fr 1fr 1fr 1.5fr;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.facts div{padding:8px 10px;border-right:1px solid var(--line)}.facts div:last-child{border:0}
.facts small{display:block;color:var(--dim2);font-size:11px}.facts b{font:500 14px 'Geist Mono',monospace}
.chk{display:flex;flex-direction:column;gap:7px}
.chk div{display:flex;align-items:center;gap:9px;color:var(--dim)}
.chk em{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--dim2);flex:none;font-style:normal;display:grid;place-items:center;font-size:9px;color:var(--acink)}
.chk .d em{background:var(--ok);border-color:var(--ok)}.chk .d{color:var(--tx)}
.chk .x{margin-left:auto;color:var(--ac2);font-size:12px}
.sech{font-weight:600;font-size:12px;color:var(--dim2)}
/* D2 waveform rows */
.wrows{margin-top:14px;flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:6px}
.wr{display:grid;grid-template-columns:34px 190px 1fr 150px 96px;align-items:center;gap:16px;padding:0 14px;height:60px;border:1px solid var(--line);border-radius:12px;background:var(--p1)}
.wr.sel{background:var(--p2);border-color:var(--line2)}
.wr .wf{height:34px}
.wr .meta{display:flex;gap:10px;align-items:center;justify-content:flex-end}
/* D3 next up */
.grp3{margin-top:18px;display:flex;flex-direction:column}
.gh{display:flex;align-items:baseline;gap:10px;padding:0 0 8px;border-bottom:1px solid var(--line2)}
.gh h2{font:700 19px var(--hf);letter-spacing:-.02em}
.gh span{color:var(--dim)}
.gh a{margin-left:auto;color:var(--ac2);font-size:12.5px}
.nr{display:grid;grid-template-columns:34px 210px 1fr 180px;align-items:center;gap:14px;height:42px;border-bottom:1px solid var(--line);padding:0 4px}
.nr .acts{display:flex;gap:6px;justify-content:flex-end}
.nr .why{display:flex;gap:6px;align-items:center;color:var(--dim)}
.scr3{overflow:hidden}
</style></head><body>
<div class="ctl"><div class="grp" id="sw"><button data-d="1" class="on">1 · Ledger</button><button data-d="2">2 · Waveforms</button><button data-d="3">3 · Next up</button></div></div>
<div class="note" id="note"></div>
<div class="app" id="app">
  <div class="nav">
    <div class="brand">Studio<i>HQ</i></div>
    <div class="item" style="padding-top:8px;padding-bottom:8px;background:var(--p2);border:1px solid var(--line);color:var(--dim)">Search <span class="sp"></span><span class="sm2">⌘K</span></div>
    <div class="item" style="margin-top:8px">Home</div>
    <div class="sec">Make</div>
    <div class="item on">Beats <span class="badge">78</span></div>
    <div class="sub">Ready to pitch</div><div class="sub">Needs info</div><div class="sub">Stale WIPs</div>
    <div class="item">Loops</div><div class="item">Sounds</div><div class="item">Kits</div><div class="item">Map</div>
    <div class="sec">Sell</div><div class="item">Store</div><div class="item">Sales</div>
    <div class="sec">Reach</div><div class="item">Pitch CRM</div><div class="item">Leads <span class="badge">279</span></div><div class="item">Content</div>
    <div class="nav-foot"><div class="av"></div><div>Keegan<div class="sm2">Studio session off</div></div></div>
  </div>
  <div class="stage">
    <div class="top"><div class="cmd">Search beats, leads, anything <kbd>⌘K</kbd></div><div class="sp"></div><div class="btn">Start session</div><div class="btn pri">New beat</div></div>
    <div id="s1" class="screen"></div><div id="s2" class="screen hide"></div><div id="s3" class="screen hide"></div>
    <div class="dock"><div class="play">▶</div><div><div class="t">Retroville</div><div class="s">0:42 / 2:28</div></div><div class="wf" id="dockwf"></div><span class="chip">Audition</span></div>
  </div>
</div>
<script>
const B=[
 ['Spider','@luka','november beats 2026',120,'A#m','2:59','fin','today',5],
 ['rouge','','',null,null,null,'wip','yesterday',1],
 ['Retroville','@dreamers','november beats 2026',142,'Gm','2:28','fin','9d ago',4],
 ['glo gang','','',null,null,null,'wip','10d ago',1],
 ['glo','','',null,null,null,'wip','10d ago',1],
 ['huhhh','','',null,null,null,'wip','10d ago',1],
 ['new mel','','',null,null,null,'wip','11d ago',1],
 ['OVERDRIVE','@3you','october beats 2026',143,'Dm','2:29','fin','12d ago',4],
 ['beatifulllll','','',null,null,null,'wip','17d ago',1],
 ['Level Above','@parkerhill','october beats 2026',159,'A#m','2:37','fin','19d ago',5],
 ['Call The Ambulance','@parkerhill','october beats 2026',163,'D#m','2:21','fin','20d ago',3],
 ['Corrupt','','october beats 2026',170,'Dm','2:45','fin','20d ago',3],
];
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
function wf(n,played,h=100){let s='<svg class="w" viewBox="0 0 '+n*4+' 40" preserveAspectRatio="none">';
 for(let i=0;i<n;i++){const e=Math.sin(i/n*Math.PI)*.5+.5;const v=Math.max(.12,Math.min(1,(rnd()*.7+.3)*(.45+e*.55)));const hh=v*38;
  s+=`<rect x="${i*4}" y="${20-hh/2}" width="2.4" height="${hh}" rx="1.2" fill="${i<n*played?'#8b7cff':'#3b3a4d'}"/>`}return s+'</svg>'}
const tag=(t)=>t?`<span class="chip">${t.replace(' 2026','')}</span>`:'';
const stl={fin:'Finished',wip:'Work in progress',idea:'Idea'};
const rd=n=>'<span class="ready">'+[1,2,3,4,5].map(i=>`<i class="${i<=n?'f':''}"></i>`).join('')+'</span>';
const noA=b=>b[3]==null;
// ---- 1 Ledger
let h=`<div class="main"><h1>Beats</h1><div class="lede">78 beats. 53 are finished, 21 are still in progress.</div>
<div class="bar"><div class="seg"><span class="on">All<b>78</b></span><span>Ideas<b>4</b></span><span>In progress<b>21</b></span><span>Finished<b>53</b></span><span>Sent<b>0</b></span><span>Sold<b>0</b></span></div><div class="sp"></div><span class="sm2">Group versions</span><div class="btn sm">Sort: Newest</div><div class="btn sm">Clean up projects</div><div class="btn sm">Rescan FL</div></div>
<div class="tbl"><div class="th"><span></span><span>Beat</span><span>Tags</span><span>BPM</span><span>Key</span><span>Length</span><span>Ready</span><span>Stage</span></div>`;
B.forEach((b,i)=>{h+=`<div class="tr ${i==2?'sel':''}"><span class="pl ${i==2?'on':''}">${noA(b)?'':'▶'}</span><span><span class="name">${b[0]}</span> ${b[1]?`<span class="sm2">${b[1]}</span>`:''} ${noA(b)?'<span class="fl">FL project</span>':''}</span><span class="tg">${tag(b[2])}</span><span class="mono">${b[3]??'–'}</span><span>${b[4]?`<span class="key">${b[4]}</span>`:'<span class="mono">–</span>'}</span><span class="mono">${b[5]??'–'}</span>${rd(b[8])}<span class="st ${b[6]}">${b[6]=='fin'?'Finished':'WIP'}</span></div>`});
h+=`</div></div>
<div class="insp"><div><div class="sm2">november beats 2026</div><h3>Retroville</h3><div class="sm2" style="margin-top:3px">@dreamers · added 9 days ago</div></div>
<div class="wfbig" id="big"></div>
<div class="facts"><div><small>BPM</small><b>142</b></div><div><small>Key</small><b>Gm</b></div><div><small>Length</small><b>2:28</b></div><div><small>Stage</small><b style="font:500 12px Geist;color:var(--ok)">Finished</b></div></div>
<div class="sech">Ready to sell</div>
<div class="chk"><div class="d"><em>✓</em>Audio file</div><div class="d"><em>✓</em>BPM and key</div><div class="d"><em>✓</em>Tags</div><div class="d"><em>✓</em>Splits agreed</div><div><em></em>Cover<span class="x">Add</span></div></div>
<div style="display:flex;gap:8px"><div class="btn pri" style="flex:1;text-align:center">Pitch</div><div class="btn" style="flex:1;text-align:center">Make video</div></div>
<div class="btn" style="text-align:center">Add to store</div></div>`;
document.getElementById('s1').innerHTML=h;
document.getElementById('big').innerHTML=wf(70,.3);
// ---- 2 Waveforms
h=`<div class="main"><h1>Beats</h1><div class="lede">Play any beat from its waveform. Click anywhere on it to jump there.</div>
<div class="bar"><div class="seg"><span class="on">All<b>78</b></span><span>Ideas<b>4</b></span><span>In progress<b>21</b></span><span>Finished<b>53</b></span><span>Sent<b>0</b></span><span>Sold<b>0</b></span></div><div class="sp"></div><div class="btn sm">Sort: Newest</div><div class="btn sm">Filter</div></div>
<div class="wrows">`;
B.filter(b=>!noA(b)).concat(B.filter(b=>!noA(b)).slice(0,3)).slice(0,8).forEach((b,i)=>{h+=`<div class="wr ${i==2?'sel':''}"><span class="pl ${i==2?'on':''}">▶</span><span><div class="name">${b[0]}</div><div class="sm2">${b[1]||'no collaborator'} · ${b[7]}</div></span><div class="wf">${wf(110,i==2?.3:0)}</div><span class="meta"><span class="mono">${b[3]} bpm</span><span class="key">${b[4]}</span><span class="mono">${b[5]}</span></span><span class="st ${b[6]}" style="justify-content:flex-end">Finished</span></div>`});
h+=`</div></div>`;
document.getElementById('s2').innerHTML=h;
// ---- 3 Next up
const row=(b,acts,why)=>`<div class="nr"><span class="pl">${noA(b)?'':'▶'}</span><span><span class="name">${b[0]}</span> <span class="sm2">${b[7]}</span></span><span class="why">${why}</span><span class="acts">${acts}</span></div>`;
h=`<div class="main"><h1>Beats</h1><div class="lede">12 are ready to pitch, 9 are missing details, and 6 work-in-progress files haven't been touched in 3 weeks.</div>
<div class="bar"><div class="seg"><span class="on">By next step</span><span>All<b>78</b></span><span>Finished<b>53</b></span><span>In progress<b>21</b></span></div><div class="sp"></div><div class="btn sm">Clean up projects</div><div class="btn sm">Rescan FL</div></div>
<div class="grp3"><div class="gh"><h2>Ready to pitch</h2><span>12</span><a>Pitch all 12</a></div>
${row(B[0],'<span class="btn sm pri">Pitch</span><span class="btn sm">Video</span>','<span class="mono">120 bpm</span><span class="key">A#m</span><span class="chip">november beats</span>')}
${row(B[2],'<span class="btn sm pri">Pitch</span><span class="btn sm">Video</span>','<span class="mono">142 bpm</span><span class="key">Gm</span><span class="chip">november beats</span>')}
${row(B[9],'<span class="btn sm pri">Pitch</span><span class="btn sm">Video</span>','<span class="mono">159 bpm</span><span class="key">A#m</span><span class="chip">october beats</span>')}
</div>
<div class="grp3"><div class="gh"><h2>Needs details</h2><span>9</span><a>Fill in with AI guess</a></div>
${row(B[10],'<span class="btn sm">Add details</span>','<span class="chip warn">no cover</span><span class="chip warn">no splits</span>')}
${row(B[11],'<span class="btn sm">Add details</span>','<span class="chip warn">no collaborator</span><span class="chip warn">no cover</span>')}
</div>
<div class="grp3"><div class="gh"><h2>Stale work in progress</h2><span>6</span><a>Archive all 6</a></div>
${row(B[4],'<span class="btn sm">Open in FL</span><span class="btn sm">Archive</span>','<span class="sm2">Untouched 34 days</span>')}
${row(B[5],'<span class="btn sm">Open in FL</span><span class="btn sm">Archive</span>','<span class="sm2">Untouched 29 days</span>')}
</div></div>`;
document.getElementById('s3').innerHTML=h;
document.getElementById('dockwf').innerHTML=wf(60,.3);
const notes={1:'Direction 1 · Ledger: the same table you have now, tidied. A readiness meter replaces the cover blobs, and a side panel shows the selected beat with a sell checklist.',
2:'Direction 2 · Waveforms: audio first. Every finished beat is one wide row; the waveform is the scrubber. Work in progress files without audio are hidden here (they stay in Ledger).',
3:'Direction 3 · Next up: beats grouped by what to do with them, matching the Home screen. Each row has the one or two actions that make sense.'};
function set(d){['1','2','3'].forEach(k=>document.getElementById('s'+k).classList.toggle('hide',k!=d));document.querySelectorAll('#sw button').forEach(b=>b.classList.toggle('on',b.dataset.d==d));document.getElementById('note').textContent=notes[d];}
document.querySelectorAll('#sw button').forEach(b=>b.onclick=()=>set(b.dataset.d));set('1');
</script></body></html>
